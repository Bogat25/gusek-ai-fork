# =====================================================================
# GUSEK AI Assistant Configuration
# =====================================================================
# This file defines defaults for the built-in local AI assistant.
# User overrides can be placed in %LOCALAPPDATA%\GusekAI\GusekAI.ini
#
# Paths are relative to GUSEK's application home directory unless absolute.
# =====================================================================

# Enable the assistant feature (yes/no). Setting to no removes the menu entry.
enabled = yes

# Accelerator hotkey (Ctrl+Shift+<hotkey>). Default: T
hotkey = T

# Pinned llama.cpp server executable
server_exe = ai/llama/llama-server.exe

# Pinned text model (Qwen3.5-4B-Q4_K_M)
model = ai/models/Qwen3.5-4B-Q4_K_M.gguf
model_url = https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/e87f176479d0855a907a41277aca2f8ee7a09523/Qwen3.5-4B-Q4_K_M.gguf
model_sha256 = 00fe7986ff5f6b463e62455821146049db6f9313603938a70800d1fb69ef11a4
model_bytes = 2740937888

# Multimodal picture reader (vision projector)
vision = yes
vision_model = ai/models/Qwen3.5-4B-mmproj-F16.gguf
vision_url = https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/e87f176479d0855a907a41277aca2f8ee7a09523/mmproj-F16.gguf
vision_sha256 = cd88edcf8d031894960bb0c9c5b9b7e1fea6ebee02b9f7ce925a00d12891f864
vision_bytes = 672423616
image_max_tokens = 256

# Server network settings (loopback only)
host = 127.0.0.1
port = 28713

# Process supervision settings
autostart = yes
startup_timeout = 240
request_timeout = 120

# Extra server arguments (leave empty by default)
extra_args =

# Model execution parameters (CPU only)
ctx_size = 8192
n_predict = 1024
threads = 0
gpu_layers = 0
temperature = 0.3
top_p = 0.9

# Reasoning / thinking parameters
thinking = no
strip_think = yes

# System prompt and course context
system_prompt_file = ai/system_prompt.txt
context_dir = ai/context
context_max_chars = 12000
keep_history = 12
